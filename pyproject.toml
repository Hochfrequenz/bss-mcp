[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bss-mcp"
version = "0.1.0"
description = "MCP server for the Basic Supply Service (BSS) — read-only debug tools"
requires-python = ">=3.12"
dependencies = [
    "bssclient>=0.3",
    "fastmcp>=3.0",
    "pydantic-settings>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.scripts]
bss-mcp = "bss_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bss_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["unittests"]

[tool.ruff]
target-version = "py312"
line-length = 120
