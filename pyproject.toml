[build-system]
requires = ["hatchling>=1.29.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "bss-mcp"
dynamic = ["readme", "version"]
description = "MCP server for the Basic Supply Service (BSS) — read-only debug tools"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info+pip@hochfrequenz.de" }]
keywords = ["bss", "basicsupply", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "bssclient>=0.3.1",
    "fastmcp>=3.0",
    "pydantic-settings>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
tests = [
    "pytest>=9",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3",
]
linting = [
    "ruff==0.16.2",
]
type_check = [
    "mypy>=1.10",
    {include-group = "tests"},
]
spell_check = [
    "codespell>=2",
]
coverage = [
    "coverage>=7",
    {include-group = "tests"},
]
dev = [
    {include-group = "tests"},
    {include-group = "linting"},
    {include-group = "type_check"},
    {include-group = "spell_check"},
    {include-group = "coverage"},
]

[tool.uv]
default-groups = []

[project.scripts]
bss-mcp = "bss_mcp.server:main"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/bss_mcp_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["unittests"]

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "N",   # pep8-naming
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PTH", # flake8-use-pathlib
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "TC",  # flake8-type-checking
    "PIE", # flake8-pie
    "RSE", # flake8-raise
    "ISC", # flake8-implicit-str-concat
    "S",   # flake8-bandit (this is an MCP server)
]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
    "ISC001",  # single-line-implicit-string-concatenation (conflicts with ruff format)
]

[tool.ruff.lint.per-file-ignores]
# Standing globs: tests may use assert and magic values freely.
"unittests/**" = [
    "S101",    # assert-used
    "PLR2004", # magic-value-comparison
]
# Grandfathered pre-existing violations (generated; zero lint churn on existing code).
"src/bss_mcp/server.py" = [
    "PLC0415", # import-outside-top-level
]

[mypy]
truethy-bool = true

[tool.mypy]
disable_error_code = []
